name: Deploy to Cloudflare Pages

# 为什么需要这个：2026-10-22 建的兜底。当时 Cloudflare Pages 的 Git 自动部署卡住了
# （停在 d737fbb，之后 6 个提交都没上线），所以加这条用 wrangler 直接推，绕开它的构建队列。
#
# 2026-11-27 改了触发方式：只留 workflow_dispatch（手动）。
# 原因 —— Cloudflare 的 Git 集成已经恢复正常，push 会正常触发 pages build and deployment；
# 这条还挂在 push 上就会每次提交跑两遍部署，谁后完成谁生效，排查线上版本时一团乱。
# 平时交给 Cloudflare 那条；它哪天又卡住，去 Actions 页面手动 Run workflow 一次即可。
#
# 需要的两个 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens → 用 "Edit Cloudflare Workers" 模板
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare → 任意域名的 Overview 页右下角 Account ID
#
# 2026-11-27 查出来的事：这两个密钥从来没配过。于是这条 workflow 每次都走
# 「检查为空 → 跳过」，GitHub 打绿勾，实际一行都没部署；线上一直是 Cloudflare
# 自己的 Git 集成在干活。绿勾把「什么都没做」藏着，比红叉更坑。
# 现在改成缺密钥直接 exit 1，把原因写在错误里，不再假装成功。

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查密钥
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$TOKEN" ]; then missing="CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$ACCOUNT" ]; then missing="${missing:+$missing、}CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::缺少 GitHub Secret：$missing。没有密钥就部署不了，不会再报成功。"
            echo "去 Settings → Secrets and variables → Actions 补齐，或者交给 Cloudflare 的 Git 集成。"
            exit 1
          fi
          echo "密钥齐全，开始部署"

      - name: 部署静态站点
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=chengfa --branch=main --commit-dirty=true
