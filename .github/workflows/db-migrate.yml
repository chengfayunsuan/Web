name: D1 Migrations

# 自动把 db/migrations 里「尚未执行」的迁移打到生产库。
#
# 触发：
#   - push 到 main 且改动了 db/migrations/**（自动）
#   - Actions 页面手动 Run workflow（兜底）
#
# 为什么不能把历史迁移也放进来：
#   db/migrate-002..030 是早期手工执行的，其中不少是 ALTER TABLE ADD COLUMN，
#   重复执行会直接报错。wrangler 只跟踪 migrations_dir 里的文件，
#   所以历史文件留在 db/ 原地，自动化只管 db/migrations/0001 之后的新迁移。
#
# 幂等：wrangler 用 d1_migrations 表记录已执行的文件，重复触发不会重复执行。
#
# 需要的两个 GitHub Secrets（与部署共用）：
#   CLOUDFLARE_API_TOKEN   Cloudflare → My Profile → API Tokens → "Edit Cloudflare Workers" 模板
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare → 任意域名的 Overview 页右下角 Account ID
# 没配密钥时直接报错退出（2026-11-27 改）。
# 原来写的是「自动跳过、不报红叉」，结果 09:30 那次 push 触发的运行打了绿勾，
# 实际「应用 D1 迁移」这一步是 skipped，一行 SQL 都没跑。
# 数据库迁移假装成功比报错危险得多：人会以为改完了。

on:
  push:
    branches: [main]
    paths:
      - 'db/migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查密钥
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          if [ -z "$TOKEN" ]; then missing="CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$ACCOUNT" ]; then missing="${missing:+$missing、}CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::缺少 GitHub Secret：$missing。迁移没有执行，不要当成已完成。"
            echo "去 Settings → Secrets and variables → Actions 补齐，或本地跑 wrangler d1 migrations apply。"
            exit 1
          fi
          echo "密钥齐全，开始迁移"

      - name: 应用 D1 迁移
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply chengfa-db --remote --force
